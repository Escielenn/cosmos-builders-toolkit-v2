    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "StellarForge",
      "description": "Science fiction worldbuilding tools for creating rich, lived-in worlds with comprehensive tools for spacecraft, planets, cultures, and more.",
      "url": "https://stellarforge.tools",
      "applicationCategory": "CreativeWork",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "4.99",
        "priceCurrency": "USD",
        "priceValidUntil": "2027-12-31"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      }
    }
    </script>

    <!-- Fonts: StellarForge Design System v2.1 (Retro Sci-Fi Uplift)
         - MD Nichrome: Display/hero headings (300, 400) — self-hosted
         - Jura: Section headings, buttons, nav (300-700)
         - DM Sans: Body text (300, 400, 500, 600 + italic 400)
         - JetBrains Mono: Code/technical (300, 400, 500)
         Four fonts only (SF-II settled decision #4, 2026-06-11) — the fifth legacy font is retired.
         NOTE: Inter is explicitly forbidden per design guidelines -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/fonts/md-nichrome/md-nichrome.css">
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
