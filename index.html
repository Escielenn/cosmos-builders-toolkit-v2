    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "StellarForge",
      "description": "Science fiction worldbuilding tools for creating rich, lived-in worlds with comprehensive tools for spacecraft, planets, cultures, and more.",
      "url": "https://stellarforge.tools",
      "applicationCategory": "CreativeWork",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "4.99",
        "priceCurrency": "USD",
        "priceValidUntil": "2027-12-31"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      }
    }
    </script>

    <!-- Fonts: StellarForge Design System
         - DM Sans: Body text (400, 500)

         NOTE: Inter is explicitly forbidden per design guidelines -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
