  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

*/\n  --sf-void: #0A0E17;\n  --sf-surface: #0E1320;\n  --sf-surface-elevated: #161C2B;\n  --sf-surface-80: rgba(14, 19, 32, 0.9);\n\n  /* Borders */\n  --sf-border: rgba(255, 255, 255, 0.08);\n  --sf-border-strong: rgba(255, 255, 255, 0.14);\n\n  /* Accents */\n  --sf-teal: #15C17B;\n  --sf-teal-bright: #3DFFCD;\n  --sf-cyan: #00D4FF;\n  --sf-amber: #FFB800;\n  --sf-amber-warm: #FFB347;\n  --sf-stellar: #5B8DEF;\n  --sf-emerald: #00FF88;\n  --sf-violet: #9B5DE5;\n  --sf-crimson: #FF3366;\n  --sf-azure: #4D9FFF;\n  --sf-magenta: #FF00AA;\n\n  /* Text tiers */\n  --t1: #FAFAFA;\n  --t2: #C8C8C8;\n  --t3: rgba(255, 255, 255, 0.45);\n  --t4: rgba(255, 255, 255, 0.28);\n  --t5: rgba(255, 255, 255, 0.15);\n\n  /* Fonts */\n  --font-display: 'MD Nichrome', 'Space Grotesk', sans-serif;\n  --font-heading: 'Jura', 'DM Sans', sans-serif;\n  --font-sans: 'DM Sans', system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n\n  /* Tracking */\n  --tr-title: 0.08em;\n  --tr-wide: 0.2em;\n  --tr-ultra: 0.4em;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  background: var(--sf-void);\n  color: var(--t2);\n  font-family: var(--font-sans);\n  font-weight: 400;\n  -webkit-font-smoothing: antialiased;\n  line-height: 1.55;\n}\n\n/* Shared primitives */\n.sf-h1 {\n  font-family: var(--font-display);\n  font-weight: 300;\n  letter-spacing: var(--tr-title);\n  color: var(--t1);\n  text-transform: uppercase;\n}\n\n.sf-eyebrow {\n  font-family: var(--font-heading);\n  font-weight: 500;\n  font-size: 11px;\n  letter-spacing: var(--tr-wide);\n  text-transform: uppercase;\n  color: var(--t3);\n}\n\n.sf-label {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: 11px;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n  color: var(--t3);\n}\n\n.sf-mono {\n  font-family: var(--font-mono);\n  font-weight: 400;\n  letter-spacing: 0.02em;\n}\n\n.sf-section {\n  font-family: var(--font-heading);\n  font-weight: 300;\n  font-size: 20px;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n  color: var(--t1);\n}\n\n.sf-panel {\n  background: var(--sf-surface-80);\n  border: 1px solid var(--sf-border);\n  border-radius: 0;\n  backdrop-filter: blur(16px);\n  position: relative;\n}\n\n.sf-panel--glow::before {\n  content: '';\n  position: absolute;\n  bottom: 0; left: 10%; right: 10%;\n  height: 1px;\n  background: linear-gradient(to right, transparent, rgba(61,255,205,0.25), transparent);\n  pointer-events: none;\n}\n\n.sf-bracket {\n  position: relative;\n}\n.sf-bracket::before,\n.sf-bracket::after {\n  content: '';\n  position: absolute;\n  width: 12px; height: 12px;\n  border: 1px solid var(--sf-teal);\n}\n.sf-bracket::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }\n.sf-bracket::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }\n\n.sf-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 12px 22px;\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: 13px;\n  letter-spacing: 1.2px;\n  text-transform: uppercase;\n  border-radius: 0;\n  border: 1px solid var(--sf-teal);\n  background: var(--sf-teal);\n  color: #08110C;\n  cursor: pointer;\n  text-decoration: none;\n  transition: all 180ms ease;\n}\n.sf-btn:hover {\n  box-shadow: 0 0 24px rgba(61,255,205,0.3);\n  transform: translateY(-1px);\n}\n.sf-btn--ghost {\n  background: transparent;\n  color: var(--t1);\n  border-color: var(--sf-border-strong);\n}\n.sf-btn--ghost:hover {\n  border-color: var(--sf-teal);\n  color: var(--sf-teal-bright);\n  box-shadow: inset 0 0 20px rgba(61,255,205,0.08);\n}\n\n.sf-tag {\n  display: inline-block;\n  padding: 3px 8px;\n  font-family: var(--font-mono);\n  font-size: 10px;\n  letter-spacing: 1.2px;\n  text-transform: uppercase;\n  background: rgba(21, 193, 123, 0.06);\n  border: 1px solid rgba(21, 193, 123, 0.22);\n  color: var(--sf-teal);\n  border-radius: 2px;\n}\n.sf-tag--amber { background: rgba(255,184,0,0.06); border-color: rgba(255,184,0,0.25); color: var(--sf-amber); }\n.sf-tag--azure { background: rgba(77,159,255,0.06); border-color: rgba(77,159,255,0.25); color: var(--sf-azure); }\n.sf-tag--violet { background: rgba(155,93,229,0.06); border-color: rgba(155,93,229,0.25); color: var(--sf-violet); }\n.sf-tag--emerald { background: rgba(0,255,136,0.06); border-color: rgba(0,255,136,0.25); color: var(--sf-emerald); }\n.sf-tag--stellar { background: rgba(91,141,239,0.06); border-color: rgba(91,141,239,0.25); color: var(--sf-stellar); }\n.sf-tag--crimson { background: rgba(255,51,102,0.06); border-color: rgba(255,51,102,0.25); color: var(--sf-crimson); }\n\n.sf-divider {\n  height: 1px;\n  background: linear-gradient(to right, transparent, var(--sf-border-strong), transparent);\n  margin: 32px 0;\n}\n\n/* Starfield background */\n.starfield {\n  position: fixed;\n  inset: 0;\n  z-index: 0;\n  pointer-events: none;\n  background:\n    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent 50%),\n    radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.3), transparent 50%),\n    radial-gradient(1.5px 1.5px at 60% 20%, rgba(91,141,239,0.4), transparent 50%),\n    radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.3), transparent 50%),\n    radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.35), transparent 50%),\n    radial-gradient(1px 1px at 90% 85%, rgba(21,193,123,0.4), transparent 50%),\n    radial-gradient(1px 1px at 50% 95%, rgba(255,255,255,0.25), transparent 50%),\n    radial-gradient(1px 1px at 30% 15%, rgba(255,255,255,0.25), transparent 50%),\n    radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.3), transparent 50%),\n    radial-gradient(1px 1px at 15% 55%, rgba(255,255,255,0.3), transparent 50%);\n  background-size: 800px 600px;\n}\n\n/* Grain */\n.grain::before {\n  content: '';\n  position: fixed;\n  inset: 0;\n  pointer-events: none;\n  opacity: 0.03;\n  z-index: 1;\n  background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E\");\n}\n\n/* Scrollbar */\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-track { background: var(--sf-void); }\n::-webkit-scrollbar-thumb { background: var(--sf-surface-elevated); border: 2px solid var(--sf-void); }\n::-webkit-scrollbar-thumb:hover { background: #25304a; }\n\n/* Scrollbar utility classes (Style Guide canonical) */\n.sf-sb { scrollbar-color: #2E3548 #0A0E17; scrollbar-width: thin; }\n.sf-sb::-webkit-scrollbar { width: 8px; height: 8px; }\n.sf-sb::-webkit-scrollbar-track { background: #0A0E17; border: 0; }\n.sf-sb::-webkit-scrollbar-thumb { background: #2E3548; border: 0; border-radius: 0; }\n.sf-sb::-webkit-scrollbar-thumb:hover { background: #3D4658; }\n.sf-sb::-webkit-scrollbar-corner { background: #0A0E17; }\n\n.sf-sb--slim::-webkit-scrollbar { width: 6px; height: 6px; }\n.sf-sb--slim { scrollbar-width: thin; }\n\n.sf-sb--idle::-webkit-scrollbar-thumb {\n  background: transparent;\n  transition: background 300ms ease 800ms;\n}\n.sf-sb--idle:hover::-webkit-scrollbar-thumb,\n.sf-sb--idle.is-scrolling::-webkit-scrollbar-thumb {\n  background: #2E3548;\n  transition-delay: 0ms;\n}\n\n/* Do / Do-not card variants used by style guide */\n.sg-do { background: rgba(21,193,123,0.04); border: 1px solid rgba(21,193,123,0.35); padding: 18px 20px; }\n.sg-dont { background: rgba(255,51,102,0.04); border: 1px solid rgba(255,51,102,0.35); padding: 18px 20px; }\n.sg-dont-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--sf-crimson, #FF3366); }\n<\u002Fstyle>\n<style>\n  body { color: var(--t2); }\n  .sg-root { position: relative; z-index: 2; display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }\n\n  /* Sidebar */\n  .sg-side {\n    position: sticky; top: 0; height: 100vh; overflow-y: auto;\n    border-right: 1px solid var(--sf-border);\n    background: rgba(10,14,23,0.82);\n    backdrop-filter: blur(20px);\n    padding: 28px 0;\n  }\n  .sg-brand { display: flex; align-items: center; gap: 10px; padding: 0 28px 24px; border-bottom: 1px solid var(--sf-border); }\n  .sg-brand-wm { font-family: var(--font-display); font-weight: 300; font-size: 17px; letter-spacing: 0.24em; color: var(--t1); }\n  .sg-brand-wm em { color: var(--sf-teal); font-style: normal; }\n  .sg-brand-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--t4); margin-top: 4px; }\n\n  .sg-nav { padding: 20px 0; }\n  .sg-nav-group { padding: 0 28px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 2.4px; color: var(--t4); text-transform: uppercase; margin: 18px 0 8px; }\n  .sg-nav-group:first-child { margin-top: 0; }\n  .sg-nav a {\n    display: flex; align-items: center; gap: 12px;\n    padding: 9px 28px; color: var(--t2);\n    font-family: var(--font-sans); font-size: 13px;\n    text-decoration: none; letter-spacing: 0.5px;\n    border-left: 2px solid transparent;\n    transition: all 160ms ease;\n  }\n  .sg-nav a:hover { color: var(--t1); background: rgba(255,255,255,0.02); border-left-color: var(--sf-border-strong); }\n  .sg-nav a.active { color: var(--sf-teal-bright); border-left-color: var(--sf-teal); background: rgba(21,193,123,0.04); }\n  .sg-nav-code { font-family: var(--font-mono); font-size: 10px; color: var(--t4); min-width: 20px; }\n  .sg-nav a.active .sg-nav-code { color: var(--sf-teal); }\n\n  .sg-side-footer { padding: 24px 28px; border-top: 1px solid var(--sf-border); font-family: var(--font-mono); font-size: 10px; color: var(--t4); letter-spacing: 1.5px; line-height: 1.7; }\n\n  /* Main */\n  .sg-main { padding: 64px 80px 120px; max-width: 1400px; }\n\n  /* Hero */\n  .sg-hero { position: relative; padding: 60px 0 80px; border-bottom: 1px solid var(--sf-border); margin-bottom: 64px; }\n  .sg-hero-mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 3px; color: var(--sf-teal); display: flex; align-items: center; gap: 14px; margin-bottom: 28px; text-transform: uppercase; }\n  .sg-hero-mono::before { content: ''; width: 48px; height: 1px; background: var(--sf-teal); }\n  .sg-hero h1 {\n    font-family: var(--font-display); font-weight: 300;\n    font-size: 96px; letter-spacing: 0.03em;\n    color: var(--t1); line-height: 0.98; margin: 0 0 28px;\n  }\n  .sg-hero h1 em { font-style: normal; color: var(--sf-teal); }\n  .sg-hero p { font-size: 19px; color: var(--t2); max-width: 780px; line-height: 1.55; margin: 0; }\n  .sg-hero-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; margin-top: 56px; border-top: 1px solid var(--sf-border); }\n  .sg-hero-stat { padding: 20px 24px 0 0; }\n  .sg-hero-stat + .sg-hero-stat { border-left: 1px solid var(--sf-border); padding-left: 24px; }\n  .sg-hero-stat-k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--t4); text-transform: uppercase; }\n  .sg-hero-stat-v { font-family: var(--font-display); font-weight: 300; font-size: 40px; color: var(--t1); letter-spacing: 0.02em; margin-top: 6px; }\n\n  /* Section shell */\n  section.sg-sec { padding: 48px 0 64px; border-bottom: 1px solid var(--sf-border); scroll-margin-top: 24px; }\n  section.sg-sec:last-child { border-bottom: 0; }\n  .sg-sec-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 36px; gap: 32px; }\n  .sg-sec-head-l h2 {\n    font-family: var(--font-display); font-weight: 300;\n    font-size: 56px; letter-spacing: 0.04em;\n    color: var(--t1); margin: 8px 0 0; line-height: 1;\n  }\n  .sg-sec-code { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2.5px; color: var(--sf-teal); text-transform: uppercase; }\n  .sg-sec-head-r { font-family: var(--font-sans); font-size: 15px; color: var(--t3); max-width: 440px; text-align: right; line-height: 1.55; }\n\n  /* Generic card + grid utilities */\n  .sg-card { background: var(--sf-surface-80); border: 1px solid var(--sf-border); padding: 24px; position: relative; }\n  .sg-card-title { font-family: var(--font-heading); font-size: 12px; letter-spacing: 2px; color: var(--t3); text-transform: uppercase; margin-bottom: 14px; }\n  .sg-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }\n  .sg-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }\n  .sg-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }\n  .sg-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }\n\n  /* Subhead */\n  .sg-sub { font-family: var(--font-heading); font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--t1); font-weight: 400; margin: 40px 0 20px; display: flex; align-items: center; gap: 12px; }\n  .sg-sub::before { content: '//'; color: var(--sf-teal); font-family: var(--font-mono); font-size: 14px; }\n\n  /* Callout / rule */\n  .sg-rule { padding: 18px 24px; border-left: 3px solid var(--sf-teal); background: rgba(21,193,123,0.04); font-size: 14px; color: var(--t2); line-height: 1.6; }\n  .sg-rule--warn { border-left-color: var(--sf-crimson); background: rgba(255,51,102,0.04); }\n  .sg-rule--amber { border-left-color: var(--sf-amber); background: rgba(255,184,0,0.04); }\n  .sg-rule b { color: var(--t1); font-weight: 500; }\n\n  /* Code block */\n  .sg-code {\n    background: #070A12; border: 1px solid var(--sf-border);\n    padding: 16px 20px; font-family: var(--font-mono); font-size: 12px;\n    color: #B8D4C8; line-height: 1.7; overflow-x: auto;\n    white-space: pre;\n  }\n  .sg-code .k { color: var(--sf-teal-bright); }\n  .sg-code .v { color: #FFD280; }\n  .sg-code .c { color: var(--t4); font-style: italic; }\n  .sg-code .s { color: #9DC8FF; }\n\n  /* Do / Don't pair */\n  .sg-do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }\n  .sg-do, .sg-dont { padding: 18px 20px; border: 1px solid var(--sf-border); background: var(--sf-surface-80); }\n  .sg-do { border-left: 3px solid var(--sf-teal); }\n  .sg-dont { border-left: 3px solid var(--sf-crimson); }\n  .sg-do-label, .sg-dont-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; margin-bottom: 8px; }\n  .sg-do-label { color: var(--sf-teal); }\n  .sg-dont-label { color: var(--sf-crimson); }\n\n  /* Tables */\n  .sg-table { width: 100%; border-collapse: collapse; font-size: 13px; }\n  .sg-table th, .sg-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--sf-border); vertical-align: top; }\n  .sg-table th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 2px; color: var(--t4); text-transform: uppercase; font-weight: 400; }\n  .sg-table td { color: var(--t2); }\n  .sg-table td:first-child { font-family: var(--font-mono); color: var(--sf-teal-bright); font-size: 12px; }\n\n  /* Anchor offset for sticky nav */\n  .sg-anchor { scroll-margin-top: 24px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"grain\">\n\n<div class=\"starfield\"><\u002Fdiv>\n\n<div class=\"sg-root\">\n  <aside class=\"sg-side\">\n    <div class=\"sg-brand\">\n      <svg width=\"28\" height=\"28\" viewBox=\"0 0 40 40\"><path d=\"M20 4 L34 12 L34 28 L20 36 L6 28 L6 12 Z\" stroke=\"#3DFFCD\" stroke-width=\"1.2\" fill=\"none\"><\u002Fpath><path d=\"M20 4 L20 20 M20 20 L6 12 M20 20 L34 12 M20 20 L20 36\" stroke=\"#3DFFCD\" stroke-width=\"1\" opacity=\"0.7\" fill=\"none\"><\u002Fpath><circle cx=\"20\" cy=\"20\" r=\"1.8\" fill=\"#3DFFCD\"><\u002Fcircle><\u002Fsvg>\n      <div>\n        <div class=\"sg-brand-wm\">STELLAR<em>FORGE<\u002Fem><\u002Fdiv>\n        <div class=\"sg-brand-tag\">STYLE GUIDE · v1.0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"sg-nav\" id=\"sgNav\">\n      <div class=\"sg-nav-group\">Foundations<\u002Fdiv>\n      <a href=\"#principles\"><span class=\"sg-nav-code\">00<\u002Fspan>Principles<\u002Fa>\n      <a href=\"#tokens\"><span class=\"sg-nav-code\">01<\u002Fspan>Design Tokens<\u002Fa>\n      <a href=\"#color\"><span class=\"sg-nav-code\">02<\u002Fspan>Color System<\u002Fa>\n      <a href=\"#type\"><span class=\"sg-nav-code\">03<\u002Fspan>Typography<\u002Fa>\n      <a href=\"#space\"><span class=\"sg-nav-code\">04<\u002Fspan>Space &amp; Grid<\u002Fa>\n      <a href=\"#motion\"><span class=\"sg-nav-code\">05<\u002Fspan>Motion<\u002Fa>\n\n      <div class=\"sg-nav-group\">Components<\u002Fdiv>\n      <a href=\"#panels\"><span class=\"sg-nav-code\">06<\u002Fspan>Panels &amp; Surfaces<\u002Fa>\n      <a href=\"#buttons\"><span class=\"sg-nav-code\">07<\u002Fspan>Buttons &amp; Tags<\u002Fa>\n      <a href=\"#forms\"><span class=\"sg-nav-code\">08<\u002Fspan>Forms &amp; Inputs<\u002Fa>\n      <a href=\"#data\"><span class=\"sg-nav-code\">09<\u002Fspan>Data Display<\u002Fa>\n      <a href=\"#nav\"><span class=\"sg-nav-code\">10<\u002Fspan>Navigation<\u002Fa>\n      <a href=\"#feedback\"><span class=\"sg-nav-code\">11<\u002Fspan>Feedback &amp; Status<\u002Fa>\n\n      <div class=\"sg-nav-group\">Brand<\u002Fdiv>\n      <a href=\"#logo\"><span class=\"sg-nav-code\">12<\u002Fspan>Logo &amp; Mark<\u002Fa>\n      <a href=\"#voice\"><span class=\"sg-nav-code\">13<\u002Fspan>Voice &amp; Copy<\u002Fa>\n      <a href=\"#patterns\"><span class=\"sg-nav-code\">14<\u002Fspan>Signature Patterns<\u002Fa>\n      <a href=\"#ambient\"><span class=\"sg-nav-code\">15<\u002Fspan>Ambient Telemetry<\u002Fa>\n      <a href=\"#scrollbars\"><span class=\"sg-nav-code\">16<\u002Fspan>Scrollbars<\u002Fa>\n      <a href=\"#dosdonts\"><span class=\"sg-nav-code\">17<\u002Fspan>Do / Don't<\u002Fa>\n    <\u002Fnav>\n\n    <div class=\"sg-side-footer\">\n      STELLARFORGE.TOOLS<br>\n      39.87°N · 104.97°W<br>\n      © 2026 JASON D. BATT\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main class=\"sg-main\">\n    <!-- HERO -->\n    <div class=\"sg-hero\">\n      <div class=\"sg-hero-mono\">// ship's instrument panel · aesthetic specification<\u002Fdiv>\n      <h1>A manual<br>for the <em>ship.<\u002Fem><\u002Fh1>\n      <p>Every pixel of StellarForge should feel like it came off the same bridge console. This guide is the canonical reference — tokens, components, patterns, voice, motion — so every tool, every window, every screenshot reads as one ship, one instrument family, one mission.<\u002Fp>\n      <div class=\"sg-hero-stats\">\n        <div class=\"sg-hero-stat\"><div class=\"sg-hero-stat-k\">Palette<\u002Fdiv><div class=\"sg-hero-stat-v\">12<\u002Fdiv><\u002Fdiv>\n        <div class=\"sg-hero-stat\"><div class=\"sg-hero-stat-k\">Typefaces<\u002Fdiv><div class=\"sg-hero-stat-v\">4<\u002Fdiv><\u002Fdiv>\n        <div class=\"sg-hero-stat\"><div class=\"sg-hero-stat-k\">Core tokens<\u002Fdiv><div class=\"sg-hero-stat-v\">48<\u002Fdiv><\u002Fdiv>\n        <div class=\"sg-hero-stat\"><div class=\"sg-hero-stat-k\">Radius<\u002Fdiv><div class=\"sg-hero-stat-v\">0<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"sgSections\"><\u002Fdiv>\n\n    <div style=\"padding: 80px 0 0; border-top: 1px solid var(--sf-border); margin-top: 64px; display:flex; justify-content: space-between; align-items: baseline;\">\n      <div style=\"font-family: var(--font-mono); font-size:11px; letter-spacing: 2px; color: var(--t4);\">END OF DOCUMENT · MANIFEST COMPLETE<\u002Fdiv>\n      <a href=\"Campaign.html\" class=\"sf-btn sf-btn--ghost\">↵ RETURN TO CAMPAIGN HUB<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script src=\"d5e4bc59-0e1d-44e0-98cd-224459467f42\"><\u002Fscript>\n<script src=\"0030b493-3873-49cc-b555-13aaf2dbee07\"><\u002Fscript>\n<script src=\"f00138f2-61ef-45b8-a32e-a7da09ecff93\"><\u002Fscript>\n<script>\n  // Inject sections\n  document.getElementById('sgSections').innerHTML = window.__SG_SECTIONS || '';\n\n  // ── Velocity dial animation\n  (function() {\n    const frames = [\n      { name: 'EARTH ROTATION', v: '0.465', u: 'km/s', pct: 0.05 },\n      { name: 'SOLAR ORBIT',    v: '29.78', u: 'km/s', pct: 0.22 },\n      { name: 'SOLAR APEX',     v: '19.4',  u: 'km/s', pct: 0.15 },\n      { name: 'GALACTIC ORBIT', v: '230',   u: 'km/s', pct: 0.88 },\n    ];\n    const needle = document.getElementById('veloNeedle');\n    const frameEl = document.getElementById('veloFrame');\n    const valEl   = document.getElementById('veloValue');\n    const arcEl   = document.getElementById('veloArcFill');\n    if (!needle) return;\n    let i = 0;\n    function setArc(pct) {\n      const start = -Math.PI * 1.25;\n      const sweep = Math.PI * 1.5 * pct;\n      const end = start + sweep;\n      const r = 60, cx = 100, cy = 100;\n      const x1 = cx + Math.cos(start)*r, y1 = cy + Math.sin(start)*r;\n      const x2 = cx + Math.cos(end)*r,   y2 = cy + Math.sin(end)*r;\n      const large = sweep > Math.PI ? 1 : 0;\n      arcEl.setAttribute('d', `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`);\n    }\n    function tick() {\n      const f = frames[i % frames.length];\n      frameEl.textContent = f.name;\n      valEl.innerHTML = `${f.v}<span style=\"font-size:12px; color:var(--t4); margin-left:4px;\">${f.u}<\u002Fspan>`;\n      const deg = -135 + (270 * f.pct);\n      needle.style.transform = `rotate(${deg}deg)`;\n      setArc(f.pct);\n      i++;\n    }\n    tick();\n    setInterval(tick, 3400);\n  })();\n\n  // ── Parallax strips\n  (function() {\n    const strips = document.querySelectorAll('.sf-plx-strip');\n    if (!strips.length) return;\n    const demo = document.getElementById('sf-parallax-demo');\n    function update() {\n      const rect = demo ? demo.getBoundingClientRect() : { top: 0 };\n      const progress = -rect.top * 0.5; // scroll-linked offset\n      strips.forEach(el => {\n        const speed = parseFloat(el.dataset.speed) || 1;\n        el.style.transform = `translate3d(${-progress * speed}px, 0, 0)`;\n      });\n    }\n    window.addEventListener('scroll', update, { passive: true });\n    update();\n  })();\n\n  // ── Scrollbar \"is-scrolling\" helper for idle-hide demo\n  document.querySelectorAll('.sf-sb--idle').forEach(el => {\n    let t;\n    el.addEventListener('scroll', () => {\n      el.classList.add('is-scrolling');\n      clearTimeout(t);\n      t = setTimeout(() => el.classList.remove('is-scrolling'), 800);\n    });\n  });\n\n  // Nav scroll-spy\n  const navLinks = Array.from(document.querySelectorAll('#sgNav a'));\n  const sections = navLinks.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);\n  function onScroll() {\n    const y = window.scrollY + 120;\n    let active = sections[0];\n    for (const s of sections) { if (s && s.offsetTop <= y) active = s; }\n    navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + (active ? active.id : '')));\n  }\n  document.addEventListener('scroll', onScroll, { passive: true });\n  onScroll();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
