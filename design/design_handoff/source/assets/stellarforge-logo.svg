  <rect x="0" y="0" width="64" height="64" fill="#000000" rx="8"></rect>
  <path d="M 56 8 Q 40 12, 24 28 Q 12 44, 16 56" stroke="url(#swooshGradient)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"></path>
